apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-configs
data:
  config.ini: {{ tpl (.Files.Get "config/grafana/config.ini") $ | quote }}
  datasources.yaml: {{ tpl (.Files.Get "config/grafana/datasources.yaml") $ | quote }}
  dashboards.yaml: {{ .Files.Get "config/grafana/dashboards.yaml" | quote }}

