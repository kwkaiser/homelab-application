apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    configmap.reloader.stakater.com/reload: "dashy-configs"
  name: dashy
spec:
  selector:
    matchLabels:
      app: dashy
  replicas: 1
  template:
    metadata:
      labels:
        app: dashy
        app.kubernetes.io/name: dashy
    spec: 
      volumes: 
        - name: dashy-configs
          configMap:
            name: dashy-configs
            items:
              - key: configuration.yaml
                path: configuration.yaml

      containers:
        - name: dashy
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 80
            - containerPort: 8080

          volumeMounts:
            - name: dashy-configs
              mountPath: /app/user-data/conf.yml
              subPath: configuration.yaml
              readOnly: false

        