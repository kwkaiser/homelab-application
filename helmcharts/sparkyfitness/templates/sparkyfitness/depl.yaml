apiVersion: apps/v1
kind: Deployment
metadata:
  name: sparkyfitness
spec:
  selector:
    matchLabels:
      app: sparkyfitness
  replicas: 1
  template:
    metadata:
      labels:
        app: sparkyfitness
        app.kubernetes.io/name: sparkyfitness
    spec:
      containers:
        - name: sparkyfitness
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "250m"
          ports:
            - containerPort: 80

          env:
            - name: SPARKY_FITNESS_SERVER_HOST
              value: sparkyfitnessserver

            - name: SPARKY_FITNESS_SERVER_PORT
              value: "3010"

            - name: SPARKY_FITNESS_FRONTEND_URL
              value: https://fit.{{ .Values.global.domainName }}.{{ .Values.global.tld }}
