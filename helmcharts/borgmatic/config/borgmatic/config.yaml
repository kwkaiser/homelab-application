# Sources
source_directories:
  - /bulk/application/gitea/data
  - /bulk/application/gitea/repos
  # - /bulk/application/jellyfin      # not deployed on hetzner
  # - /bulk/application/qbittorrent   # not deployed on hetzner
  # - /bulk/application/calibre       # not deployed on hetzner
  - /bulk/application/calibre-web
  # - /bulk/application/openldap      # not deployed on hetzner
  # - /bulk/application/prowlarr      # not deployed on hetzner
  # - /bulk/application/radarr        # not deployed on hetzner
  # - /bulk/application/sonarr        # not deployed on hetzner
  - /bulk/application/immich/media
  - /bulk/application/mealie/app
  - /bulk/application/syncthing
  - /bulk/application/authentik
  # - /bulk/application/opnsense      # not reachable from hetzner's network
  - /bulk/shared/books

postgresql_databases:
  - name: postgres
    hostname: giteadb
    username: postgres
    password: ${GITEA_DB_PASSWORD}
    format: tar

  - name: postgres
    hostname: minifluxdb
    username: postgres
    password: ${MINIFLUX_DB_PASSWORD}
    format: tar

  - name: postgres
    hostname: immichdb
    username: postgres
    password: ${IMMICH_DB_PASSWORD}
    format: tar

  - name: postgres
    hostname: mealiedb
    username: postgres
    password: ${MEALIE_DB_PASSWORD}
    format: tar

  - name: postgres
    hostname: authentikdb
    username: postgres
    password: ${AUTHENTIK_DB_PASSWORD}
    format: tar

# Retention
keep_within: 7d
keep_daily: 7
keep_weekly: 1
keep_monthly: 1

# Repos
repositories:
  - path: ssh://gyd00bnt@gyd00bnt.repo.borgbase.com/./repo
    label: borgbase

# Remote
relocated_repo_access_is_ok: true
ssh_command: ssh -o StrictHostKeyChecking=no -i /borgmatic-borgbase-key-2

extra_borg_options:
  create: --progress --stats
  prune: --stats
  compact: --progress
  check: --progress

# Actions
checks:
  - name: repository
  - name: archives
    frequency: 2 weeks

before_backup:
  - echo 'Starting backup'
  # - apk add -U curl
  # - mkdir -p /bulk/application/opnsense
  # - curl -sSfk -u "${OPNSENSE_API_KEY}:${OPNSENSE_API_SECRET}" "https://${OPNSENSE_HOST}/api/core/backup/download/this" -o /bulk/application/opnsense/config.xml || echo 'WARNING - opnsense config backup failed, continuing without it'

after_backup:
  - echo 'Ended backup'
  - borgmatic check

before_check:
  - echo 'Starting checks'

after_check:
  - echo 'Ended checks'
  - borgmatic prune --match-archives 'sh:borgmatic-*' --list

before_prune:
  - echo 'Starting prune'

after_prune:
  - echo 'Ended prune'
  - borgmatic compact

before_compact:
  - echo 'Starting compact'

after_compact:
  - echo 'Ended compact'

after_everything:
  - apk update
  - apk add -U curl
  - curl -d "Completed server backup" ntfy.sh/KAyIMTgBtdbI2uWHVZFS
