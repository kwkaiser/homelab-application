server {
  listen 443 ssl;
  include https.conf;

  server_name housing.*;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_http_version 1.1;
    proxy_buffering off;

    set $housing_web_upstream http://housing-web.default.svc.cluster.local;
    proxy_pass $housing_web_upstream;
  }
}
