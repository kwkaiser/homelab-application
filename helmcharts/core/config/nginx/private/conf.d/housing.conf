server {
  listen 443 ssl;
  include https.conf;

  server_name housing.*;

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    set $housing_web_upstream http://housing-web.default.svc.cluster.local;
    proxy_pass $housing_web_upstream;

    include authentik-location.conf;
  }

  location ~ ^/(api|mcp)(/|$) {
    if ($http_authorization = "") {
      rewrite ^ /_session$uri last;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header X-authentik-username "";
    proxy_set_header X-authentik-groups "";
    proxy_set_header X-authentik-entitlements "";
    proxy_set_header X-authentik-email "";
    proxy_set_header X-authentik-name "";
    proxy_set_header X-authentik-uid "";

    set $housing_upstream http://housing.default.svc.cluster.local;
    proxy_pass $housing_upstream;
  }

  location ^~ /_session/ {
    internal;
    set $housing_web_upstream http://housing-web.default.svc.cluster.local;
    rewrite ^/_session(/.*)$ $1 break;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_pass $housing_web_upstream;

    include authentik-location.conf;
  }

  include authentik-proxy.conf;
}
