server {
  listen 443 ssl;
  include https.conf;

  server_name map.*;

  location /pub {
    access_by_lua_block {
      local expected_user = os.getenv("OWNTRACKS_BASIC_AUTH_USER")
      local expected_pass = os.getenv("OWNTRACKS_BASIC_AUTH_PASSWORD")

      local header = ngx.var.http_authorization
      local user, pass

      if header then
        local scheme, encoded = header:match("^(%S+)%s+(%S+)$")
        if scheme and scheme:lower() == "basic" then
          local decoded = ngx.decode_base64(encoded)
          if decoded then
            user, pass = decoded:match("^([^:]*):(.*)$")
          end
        end
      end

      if not expected_user or not expected_pass or user ~= expected_user or pass ~= expected_pass then
        ngx.header["WWW-Authenticate"] = 'Basic realm="OwnTracks"'
        return ngx.exit(ngx.HTTP_UNAUTHORIZED)
      end

      ngx.req.set_header("X-Limit-U", user)
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    set $owntracks_upstream http://owntracks.default.svc.cluster.local;
    proxy_pass $owntracks_upstream;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;

    set $owntracks_upstream http://owntracks.default.svc.cluster.local;
    proxy_pass $owntracks_upstream;

    include authentik-location.conf;
  }

  include authentik-proxy.conf;
}
