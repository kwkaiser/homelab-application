apiVersion: v1
kind: Service
metadata:
  name: nginx-public
spec:
  type: NodePort
  selector:
    app: nginx-public
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 443

    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-private
spec:
  type: ClusterIP
  selector:
    app: nginx-private
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443

    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
