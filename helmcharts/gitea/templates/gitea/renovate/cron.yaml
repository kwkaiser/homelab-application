{{- $builder := .Values.renovate.nixBuilder }}
{{- $builderHost := last (splitList "@" $builder) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    secret.reloader.stakater.com/reload: "gitea.renovate.token,gitea.github.token,gitea.packages.token,nix.remote.builder.key"
  name: renovate
spec:
  schedule: "0 */24 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: bulk-nfs

            - name: renovate-configs
              configMap:
                name: renovate-configs
                items:
                  - key: config.json
                    path: config.json

            - name: nix
              emptyDir: {}

            - name: ssh
              emptyDir: {}

            - name: nix-remote-builder-key
              secret:
                secretName: nix.remote.builder.key
                items:
                  - key: value
                    path: value

          initContainers:
            - name: nix-store
              image: {{ .Values.renovateNix.image.repository }}:{{ .Values.renovateNix.image.tag }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  cp -a /nix/. /nix-shared/
                  cp /nix-remote-builder-key/value /ssh/nix-remote-builder-key
                  echo >> /ssh/nix-remote-builder-key
                  ssh-keyscan -H {{ $builderHost }} > /ssh/known_hosts
                  printf 'Host {{ $builderHost }}\n  IdentityFile /home/ubuntu/.ssh/nix-remote-builder-key\n' > /ssh/config
                  chmod 700 /ssh
                  chmod 600 /ssh/*
                  chown -R 12021 /nix-shared /ssh
              volumeMounts:
                - name: nix
                  mountPath: /nix-shared

                - name: ssh
                  mountPath: /ssh

                - name: nix-remote-builder-key
                  mountPath: /nix-remote-builder-key
                  readOnly: true

          containers:
            - name: gitea-renovate
              image: {{ .Values.renovate.image.repository }}:{{ .Values.renovate.image.tag }}

              env:
                - name: LOG_LEVEL
                  value: debug

                - name: RENOVATE_CONFIG_FILE
                  value: /usr/src/app/config.json

                - name: PATH
                  value: /nix/var/nix/profiles/default/bin:/home/ubuntu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

                - name: RENOVATE_AUTODISCOVER
                  value: "true"

                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitea.renovate.token
                      key: value

                - name: GITHUB_COM_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitea.github.token
                      key: value
                      optional: true

                - name: REGISTRY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitea.packages.token
                      key: value

                - name: RENOVATE_HOST_RULES
                  value: '[{"matchHost":"git.{{ .Values.global.domainName }}.{{ .Values.global.tld }}","hostType":"docker","username":"{{ .Values.renovate.registryUser }}","password":"$(REGISTRY_TOKEN)"}]'

              volumeMounts:
                - name: renovate-configs
                  mountPath: /usr/src/app/config.json
                  subPath: config.json
                  readOnly: false

                - name: nix
                  mountPath: /nix

                - name: ssh
                  mountPath: /home/ubuntu/.ssh
