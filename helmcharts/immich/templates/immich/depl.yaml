apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: "immich.db.password"
  name: immich
spec:
  selector:
    matchLabels:
      app: immich
  replicas: 1
  template:
    metadata:
      labels:
        app: immich
        app.kubernetes.io/name: immich
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bulk-nfs

        - name: cache-data
          persistentVolumeClaim:
            claimName: cache-nfs

      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "250m"
          ports:
            - containerPort: 6379 

          volumeMounts:
            - name: data
              mountPath: /data
              subPath: application/immich/redis

        - name: immich-ml
          image: {{ .Values.machineLearning.image.repository }}:{{ .Values.machineLearning.image.tag }}
          resources:
            requests:
              memory: "256Mi"
              cpu: "25m"
            limits:
              memory: "2Gi"
              cpu: "2"
          ports:
            - containerPort: 3003
          volumeMounts:
            - name: data
              mountPath: /cache
              subPath: application/immich/models

          env: 
            - name: IMMICH_PORT
              value: '3003'

            - name: IMMICH_HOST
              value: '0.0.0.0'

        - name: immich-server
          image: {{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}
          resources:
            requests:
              memory: "640Mi"
              cpu: "50m"
            limits:
              memory: "1536Mi"
              cpu: "2"
          ports:
            - containerPort: 2283
          env:
            - name: DB_USERNAME
              value: postgres

            - name: DB_DATABASE_NAME
              value: postgres

            - name: DB_HOSTNAME
              value: immichdb

            - name: IMMICH_PORT
              value: '2283'

            - name: IMMICH_HOST
              value: '0.0.0.0'

            - name: REDIS_HOSTNAME
              value: '0.0.0.0'

            - name: UPLOAD_LOCATION
              value: /usr/src/app/upload

            - name: IMMICH_MEDIA_LOCATION
              value: /usr/src/app/media

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich.db.password
                  key: value

          volumeMounts:
            - name: data
              mountPath: /usr/src/app/upload
              subPath: application/immich/upload
            - name: data
              mountPath: /usr/src/app/media
              subPath: application/immich/media

