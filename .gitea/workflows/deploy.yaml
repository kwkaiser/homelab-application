name: Deploy

on:
  push:
    branches:
      - main

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up remote builder SSH access
        env:
          NIX_REMOTE_BUILDER_KEY: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NIX_REMOTE_BUILDER_KEY" > /tmp/nix-remote-builder-key
          chmod 600 /tmp/nix-remote-builder-key
          ssh-keyscan -H kwkaiser.io | sudo tee -a /etc/ssh/ssh_known_hosts >/dev/null
          printf 'Host kwkaiser.io\n  User nixbuilder\n  IdentityFile /tmp/nix-remote-builder-key\n' | \
            sudo tee /etc/ssh/ssh_config.d/nix-remote-builder.conf >/dev/null

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            builders = ssh-ng://nixbuilder@kwkaiser.io x86_64-linux /tmp/nix-remote-builder-key 2 1 - - -
            builders-use-substitutes = true
            extra-substituters = ssh-ng://nixbuilder@kwkaiser.io?trusted=true
            max-jobs = 0

      - name: Lint helm chart
        run: nix develop --accept-flake-config --command task lint --yes

  release:
    name: Release
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up remote builder SSH access
        env:
          NIX_REMOTE_BUILDER_KEY: ${{ secrets.NIX_REMOTE_BUILDER_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NIX_REMOTE_BUILDER_KEY" > /tmp/nix-remote-builder-key
          chmod 600 /tmp/nix-remote-builder-key
          ssh-keyscan -H kwkaiser.io | sudo tee -a /etc/ssh/ssh_known_hosts >/dev/null
          printf 'Host kwkaiser.io\n  User nixbuilder\n  IdentityFile /tmp/nix-remote-builder-key\n' | \
            sudo tee /etc/ssh/ssh_config.d/nix-remote-builder.conf >/dev/null

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            builders = ssh-ng://nixbuilder@kwkaiser.io x86_64-linux /tmp/nix-remote-builder-key 2 1 - - -
            builders-use-substitutes = true
            extra-substituters = ssh-ng://nixbuilder@kwkaiser.io?trusted=true
            max-jobs = 0

      - name: Run helm command
        run: |
          mkdir $HOME/.kube
          echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config

          mkdir -p $HOME/.config/secretspec
          cat > $HOME/.config/secretspec/config.toml <<'CFGEOF'
          [defaults]
          provider = "env"

          [defaults.providers.kdbx]
          uri = "kdbx:/nonexistent/keys.kdbx"
          CFGEOF

          nix develop --accept-flake-config --command task deploy -y
        env:
          MODE: "prod"
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          K8S_NGINX_CERTIFICATE: ${{ secrets.K8S_NGINX_CERTIFICATE }}
          K8S_NGINX_CERTIFICATE_KEY: ${{ secrets.K8S_NGINX_CERTIFICATE_KEY }}
          K8S_WIREGUARD_KEY: ${{ secrets.K8S_WIREGUARD_KEY }}
          K8S_AUTHELIA_ENCRYPTION_KEY: ${{ secrets.K8S_AUTHELIA_ENCRYPTION_KEY }}
          K8S_AUTHELIA_SESSION_SECRET: ${{ secrets.K8S_AUTHELIA_SESSION_SECRET }}
          K8S_OPENLDAP_BINDDN_PASSWORD: ${{ secrets.K8S_OPENLDAP_BINDDN_PASSWORD }}
          K8S_GITEA_DB_PASSWORD: ${{ secrets.K8S_GITEA_DB_PASSWORD }}
          K8S_GITEA_RENOVATE_TOKEN: ${{ secrets.K8S_GITEA_RENOVATE_TOKEN }}
          K8S_GITEA_RUNNER_TOKEN: ${{ secrets.K8S_GITEA_RUNNER_TOKEN }}
          K8S_GITEA_PACKAGES_TOKEN: ${{ secrets.K8S_GITEA_PACKAGES_TOKEN }}
          K8S_MINIFLUX_DB_PASSWORD: ${{ secrets.K8S_MINIFLUX_DB_PASSWORD }}
          K8S_MINIFLUX_DB_CONNECTION_STRING: ${{ secrets.K8S_MINIFLUX_DB_CONNECTION_STRING }}
          K8S_REGISTRY_CERTIFICATE: ${{ secrets.K8S_REGISTRY_CERTIFICATE }}
          K8S_REGISTRY_CERTIFICATE_KEY: ${{ secrets.K8S_REGISTRY_CERTIFICATE_KEY }}
          K8S_REGISTRY_HTPASSWD: ${{ secrets.K8S_REGISTRY_HTPASSWD }}
          K8S_BACKUP_PASSPHRASE: ${{ secrets.K8S_BACKUP_PASSPHRASE }}
          K8S_IMMICH_DB_PASSWORD: ${{ secrets.K8S_IMMICH_DB_PASSWORD }}
          K8S_MEALIE_DB_PASSWORD: ${{ secrets.K8S_MEALIE_DB_PASSWORD }}
          K8S_BORGMATIC_BORGBASE_KEY: ${{ secrets.K8S_BORGMATIC_BORGBASE_KEY }}
          K8S_N8N_OIDC_CLIENT_SECRET: ${{ secrets.K8S_N8N_OIDC_CLIENT_SECRET }}
          K8S_AUTHELIA_OIDC_HMAC_SECRET: ${{ secrets.K8S_AUTHELIA_OIDC_HMAC_SECRET }}
          K8S_AUTHELIA_OIDC_ISSUER_PRIVATE_KEY: ${{ secrets.K8S_AUTHELIA_OIDC_ISSUER_PRIVATE_KEY }}
          K8S_AUTHENTIK_SECRET_KEY: ${{ secrets.K8S_AUTHENTIK_SECRET_KEY }}
          K8S_AUTHENTIK_DB_PASSWORD: ${{ secrets.K8S_AUTHENTIK_DB_PASSWORD }}
          K8S_GRAFANA_OAUTH_CLIENT_ID: ${{ secrets.K8S_GRAFANA_OAUTH_CLIENT_ID }}
          K8S_GRAFANA_OAUTH_CLIENT_SECRET: ${{ secrets.K8S_GRAFANA_OAUTH_CLIENT_SECRET }}
          K8S_CLOUDFLARE_API_TOKEN: ${{ secrets.K8S_CLOUDFLARE_API_TOKEN }}
          K8S_MEALIE_OIDC_CLIENTID: ${{ secrets.K8S_MEALIE_OIDC_CLIENTID }}
          K8S_MEALIE_OIDC_CLIENTSECRET: ${{ secrets.K8S_MEALIE_OIDC_CLIENTSECRET }}
          K8S_OPNSENSE_API_KEY: ${{ secrets.K8S_OPNSENSE_API_KEY }}
          K8S_OPNSENSE_API_SECRET: ${{ secrets.K8S_OPNSENSE_API_SECRET }}
          K8S_SPARKYFITNESS_DB_PASSWORD: ${{ secrets.K8S_SPARKYFITNESS_DB_PASSWORD }}
          K8S_SPARKYFITNESS_APP_DB_PASSWORD: ${{ secrets.K8S_SPARKYFITNESS_APP_DB_PASSWORD }}
          K8S_SPARKYFITNESS_API_ENCRYPTION_KEY: ${{ secrets.K8S_SPARKYFITNESS_API_ENCRYPTION_KEY }}
          K8S_SPARKYFITNESS_BETTER_AUTH_SECRET: ${{ secrets.K8S_SPARKYFITNESS_BETTER_AUTH_SECRET }}
          K8S_SPARKYFITNESS_OIDC_CLIENTID: ${{ secrets.K8S_SPARKYFITNESS_OIDC_CLIENTID }}
          K8S_SPARKYFITNESS_OIDC_CLIENTSECRET: ${{ secrets.K8S_SPARKYFITNESS_OIDC_CLIENTSECRET }}
