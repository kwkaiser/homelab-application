name: Pull request

on:
  pull_request_target:
    branches:
      - "**"

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Lint helm chart
        run: nix develop --accept-flake-config --command task lint --yes
