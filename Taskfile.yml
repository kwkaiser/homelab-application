version: "3"

tasks:
  # Local dev
  ssh-forward:
    desc: "Uses SSH port forwarding to bind local ports to vagrant ports"
    cmds:
      - sudo ssh -g -L 80:localhost:6880 -f -N kwkaiser@localhost
      - sudo ssh -g -L 443:localhost:6840 -f -N kwkaiser@localhost

  template:
    desc: "Builds helm template"
    cmds:
      - |
        DEPL_ENV="${MODE:-dev}"
        rm -f template.yaml
        helm dependency build
        helm template . --values ./values/shared.yaml --values ./values/$DEPL_ENV.yaml > template.yaml

  lint:
    desc: "Lint generated template"
    deps: [template]
    cmds:
      - |
        DEPL_ENV="${MODE:-dev}"
        helm lint . --values ./values/shared.yaml --values ./values/$DEPL_ENV.yaml
      - cat template.yaml | kubeconform

  # Local and prod
  apply-secrets:
    desc: "Creates or updates secrets in the cluster"
    cmds:
      - |
        source ensure-kdbx-password || exit 1

        DEPL_ENV="${MODE:-dev}"

        # Resolve secrets via secretspec (see secretspec.toml). "prod" is the
        # tool's implicit `default` profile; every other MODE maps to the
        # like-named profile (dev, ...).
        if [[ $DEPL_ENV == 'prod' ]]; then
          PROFILE_ARGS=()
        else
          PROFILE_ARGS=(--profile "$DEPL_ENV")
        fi
        eval "$(secretspec export "${PROFILE_ARGS[@]}")"

        KEYS=$(jq -n env | jq 'keys[] | select(startswith("K8S_"))')

        for KEY in $KEYS;
        do
          cleaned_key=$(echo $KEY | sed 's/"//g')
          cleaned_name=$(echo "$cleaned_key" | cut -c5- | sed 's/_/./g' | tr 'A-Z' 'a-z')
          value=$(jq -n env | jq ".$cleaned_key")
          cleaned_value=$(printf "$(echo ${value:1:-1})")
          kubectl create secret generic "$cleaned_name" --from-literal=value="$cleaned_value" --dry-run=client -o yaml | kubectl apply -f -
        done

  cert:
    desc: "Issues/renews the *.kwkaiser.io wildcard cert via certbot + Cloudflare DNS-01 (needs `nix develop` for the certbot+dns-cloudflare plugin)"
    cmds:
      - ./scripts/issue-cert.sh

  restore:
    desc: "Starts (or, with -- down, tears down) a toolbox pod for restoring from the Borgbase backup - see scripts/borgmatic-restore.sh header"
    cmds:
      - ./scripts/borgmatic-restore.sh {{.CLI_ARGS}}

  deploy:
    desc: "Redeploys k8s template"
    deps: [apply-secrets]
    cmds:
      - |
        rm -rf charts/*
        DEPL_ENV="${MODE:-dev}"

        if [[ $DEPL_ENV == 'prod' ]]; then
          ARGS="--values ./values/shared.yaml --values ./values/prod.yaml"
        else
          kubectl -n kube-system apply -f ./patch/cm.yaml
          kubectl -n kube-system rollout restart deployment coredns
          ARGS="--values ./values/shared.yaml --values ./values/dev.yaml"
        fi

        helm upgrade bingus . $ARGS --install --dependency-update
