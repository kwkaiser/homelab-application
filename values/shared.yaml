## Core values
core:
  authelia:
    enabled: true

## Gitea values
gitea:
  renovate:
    nixBuilder: "nixbuilder@kwkaiser.io"
  registry:
    owners: ["kwkaiser"]
    keepVersions: 1
    pruneDryRun: false
    releaseAssets:
      repos: ["kwkaiser/housing"]
      suffix: ".apk"
      keepReleases: 3
