## Core values
core:
  authelia:
    enabled: true

## Gitea values
gitea:
  renovate:
    nixBuilder: "nixbuilder@kwkaiser.io"
    registryUser: "kwkaiser"
  registry:
    owners: ["kwkaiser"]
    keepVersions: 1
    pruneDryRun: false
    releaseAssets:
      repos: ["kwkaiser/housing"]
      suffix: ".apk"
      keepReleases: 3

## Reloader values
reloader:
  reloader:
    deployment:
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "128Mi"
          cpu: "250m"
