## Core values
core:
  authelia:
    enabled: true
  image_nginx: "openresty/openresty:1.27.1.2-0-alpine"
  image_authelia: "authelia/authelia:4.39"
  image_openldap: "osixia/openldap:1.5.0"
  image_ldap_user_manager: "wheelybird/ldap-user-manager:v1.11"
  image_authentik_server: "ghcr.io/goauthentik/server:2025.10.2"
  image_authentik_db: "postgres:17.6-alpine3.21"

## Gitea values
gitea:
  image_gitea: "gitea/gitea:1.25.3"
  image_gitea_db: "postgres:16.4-alpine3.19"
  image_gitea_runner: "gitea/act_runner:0.2.13"
  image_gitea_renovate: "renovate/renovate:37-slim"
  image_dind: "docker:23.0.6-dind"
  image_registry_prune: "alpine:3.24.1"
  registry:
    owners: ["kwkaiser"]
    keepVersions: 1
    pruneDryRun: false

## Website values
website:
  image_website: "git.kwkaiser.io/kwkaiser/website:latest"

## Immich values
