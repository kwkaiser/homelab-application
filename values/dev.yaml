## Global values
global:
  domainName: kwkaiser-test
  tld: io

## Storage related values
storage:
  enabled: true
  nfsArray: "10.0.2.15"
  volBulkSize: 1Gi
  volCacheSize: 1Gi

## Chart set matches the linode-stand-in target (media-acquisition stack and
## observability suspended) so local dev exercises the same app set.
core:
  enabled: true
  authelia:
    enabled: false

dashy:
  enabled: false

gitea:
  enabled: false

immich:
  enabled: false

mealie:
  enabled: false

miniflux:
  enabled: false

media:
  enabled: false

observability:
  enabled: false
  promHosts: ["10.0.2.15:9100"]

vpn:
  enabled: false

borgmatic:
  enabled: false
  opnsenseHost: "192.168.1.1"

calibre-web:
  enabled: false

jellyfin:
  enabled: false

minecraft:
  enabled: false

syncthing:
  enabled: true
